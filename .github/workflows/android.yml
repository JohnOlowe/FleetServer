name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Signing credentials come from repository secrets - there is no password in
      # the repo. Gradle exposes every ORG_GRADLE_PROJECT_* environment variable as a
      # project property, which is exactly what app/build.gradle.kts looks for.
      # If the secrets are not set the build still succeeds, just with the standard
      # Android debug key; the "Verify APK signature" step calls that out.
      ORG_GRADLE_PROJECT_FLEETSERVER_STORE_FILE: keystore/damjay_debug.keystore
      ORG_GRADLE_PROJECT_FLEETSERVER_KEY_ALIAS: photo-triage
      ORG_GRADLE_PROJECT_FLEETSERVER_STORE_PASSWORD: ${{ secrets.FLEETSERVER_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_FLEETSERVER_KEY_PASSWORD: ${{ secrets.FLEETSERVER_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace > gradle-build.log 2>&1

      - name: Report build errors
        if: steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 build-tools/extract_errors.py gradle-build.log > build-errors.txt || true
          # full text as a check run when the token allows it
          python3 build-tools/make_check_payload.py build-errors.txt "${{ github.sha }}" "${{ github.ref_name }}" > payload.json || true
          gh api "repos/$GH_REPO/check-runs" --input payload.json || true
          # first lines as job annotations
          count=0
          while IFS= read -r line; do
            count=$((count + 1))
            if [ "$count" -gt 9 ]; then break; fi
            echo "::error::${line//%/%25}"
          done < build-errors.txt
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 build-errors.txt >> "$GITHUB_STEP_SUMMARY"
          # and the complete log on a scratch branch, so it can be fetched with git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-errors.txt
          git commit -m "build errors for ${{ github.sha }}"
          git push -f origin "HEAD:ci-logs"
          exit 1

      - name: Remove stale build-error log
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: git push origin --delete ci-logs

      - name: Run lint
        if: steps.assemble.outcome == 'success'
        run: ./gradlew lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fleetserver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"

          if [ -n "$ORG_GRADLE_PROJECT_FLEETSERVER_STORE_PASSWORD" ] && [ -n "$ORG_GRADLE_PROJECT_FLEETSERVER_KEY_PASSWORD" ]; then
            echo "signing secrets: present"
          else
            echo "::warning title=Signing secrets not set::Add FLEETSERVER_STORE_PASSWORD and FLEETSERVER_KEY_PASSWORD under Settings > Secrets and variables > Actions. Until then the APK is signed with the standard Android debug key, so it will not upgrade cleanly over a previously installed build."
            echo "signing secrets: MISSING"
          fi

          SIGNER=$(keytool -list -printcert -jarfile "$APK" 2>/dev/null | grep -m1 "Owner:" || true)
          echo "signer: ${SIGNER:-unknown}"
          if echo "$SIGNER" | grep -q "Photo Triage Stable Key"; then
            echo "stable key: yes"
            echo "Signed with the committed keystore (alias photo-triage)."
          else
            echo "::warning title=APK is not signed with the stable key::This build fell back to the Android debug key. Installs of this APK will not upgrade cleanly over older builds."
          fi
          echo "signer: ${SIGNER:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Job summary
        run: |
          echo "### FleetServer debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the **fleetserver-debug-apk** artifact and install it on your phone." >> "$GITHUB_STEP_SUMMARY"
