name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Surface build errors in the job annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = "gradle-build.log"
          if not os.path.exists(path):
              print("::error::no gradle log was produced")
              raise SystemExit(0)
          lines = open(path, errors="replace").read().splitlines()
          patterns = ("error:", "e: ", "FAILED", "What went wrong", "Caused by",
                      "Execution failed", "Could not", "cannot find symbol",
                      "incompatible types", "is not abstract", "does not override",
                      "Compilation failed", "Unresolved reference", "AAPT", "resource")
          hits = [l.rstrip() for l in lines if any(p in l for p in patterns)]
          if not hits:
              hits = lines[-80:]
          for line in hits[:45]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error::" + safe)
          PY

      - name: Run unit-free static checks (lint, report only)
        if: success()
        run: ./gradlew lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fleetserver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Job summary
        run: |
          echo "### FleetServer debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the **fleetserver-debug-apk** artifact and install it on your phone." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build release APK (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fleetserver-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
