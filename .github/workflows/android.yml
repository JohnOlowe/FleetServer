name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace > gradle-build.log 2>&1

      - name: Report build errors
        if: steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 build-tools/extract_errors.py gradle-build.log > build-errors.txt || true
          # full text as a check run when the token allows it
          python3 build-tools/make_check_payload.py build-errors.txt "${{ github.sha }}" "${{ github.ref_name }}" > payload.json || true
          gh api "repos/$GH_REPO/check-runs" --input payload.json || true
          # first lines as job annotations
          count=0
          while IFS= read -r line; do
            count=$((count + 1))
            if [ "$count" -gt 9 ]; then break; fi
            echo "::error::${line//%/%25}"
          done < build-errors.txt
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 build-errors.txt >> "$GITHUB_STEP_SUMMARY"
          # and the complete log on a scratch branch, so it can be fetched with git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-errors.txt
          git commit -m "build errors for ${{ github.sha }}"
          git push -f origin "HEAD:ci-logs"
          exit 1

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fleetserver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Job summary
        run: |
          echo "### FleetServer debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the **fleetserver-debug-apk** artifact and install it on your phone." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build release APK (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fleetserver-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
