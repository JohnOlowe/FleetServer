android.nonTransitiveRClass=true
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# Release/debug signing - keystore is committed in keystore/ so CI and local builds
# sign with the same key. Key password matches the store password: the file is PKCS12,
# where one password protects both the store and the key entry.
FLEETSERVER_STORE_FILE=keystore/damjay_debug.keystore
FLEETSERVER_STORE_PASSWORD=REPLACED_KEYSTORE_PASSWORD
FLEETSERVER_KEY_ALIAS=photo-triage
FLEETSERVER_KEY_PASSWORD=REPLACED_KEYSTORE_PASSWORD
