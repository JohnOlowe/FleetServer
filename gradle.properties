android.nonTransitiveRClass=true
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# Signing. The keystore is committed in keystore/ so CI and local builds sign with the
# same key, but the passwords are NOT stored here - this repository is public.
#
#   local builds : put them in keystore.properties (git-ignored) or in
#                  ~/.gradle/gradle.properties
#   CI           : GitHub Actions repository secrets, passed to Gradle as
#                  ORG_GRADLE_PROJECT_* environment variables
#
# See the "Signing" section of README.md for the four property names.
